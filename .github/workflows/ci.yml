name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  theme-check:
    name: Theme check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate JSON
        run: |
          python3 - <<'PY'
          import glob
          import json
          import sys

          def strip_json_comments(source):
              result = []
              index = 0
              in_string = False
              escaped = False

              while index < len(source):
                  character = source[index]
                  following = source[index + 1] if index + 1 < len(source) else ''

                  if in_string:
                      result.append(character)
                      if escaped:
                          escaped = False
                      elif character == '\\':
                          escaped = True
                      elif character == '"':
                          in_string = False
                      index += 1
                      continue

                  if character == '"':
                      in_string = True
                      result.append(character)
                      index += 1
                  elif character == '/' and following == '/':
                      index += 2
                      while index < len(source) and source[index] not in '\r\n':
                          index += 1
                  elif character == '/' and following == '*':
                      index += 2
                      while index + 1 < len(source) and source[index:index + 2] != '*/':
                          index += 1
                      index += 2
                  else:
                      result.append(character)
                      index += 1

              return ''.join(result)

          bad = []
          for path in glob.glob('**/*.json', recursive=True):
              if path.startswith('node_modules'):
                  continue
              source = strip_json_comments(open(path, encoding='utf-8').read())
              try:
                  json.loads(source)
              except Exception as error:
                  bad.append(f'{path}: {error}')
          if bad:
              print('\n'.join(bad))
              sys.exit(1)
          print('All JSON files parse.')
          PY

      - name: Run theme check
        run: npx --yes @shopify/cli@latest theme check --fail-level warning
