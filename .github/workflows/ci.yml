name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  theme-check:
    name: Theme check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate JSON
        run: |
          python3 - <<'PY'
          import json, re, glob, sys
          bad = []
          for path in glob.glob('**/*.json', recursive=True):
              if path.startswith('node_modules'):
                  continue
              source = re.sub(r'/\*.*?\*/', '', open(path, encoding='utf-8').read(), flags=re.S)
              try:
                  json.loads(source)
              except Exception as error:
                  bad.append(f'{path}: {error}')
          if bad:
              print('\n'.join(bad))
              sys.exit(1)
          print('All JSON files parse.')
          PY

      - name: Run theme check
        run: npx --yes @shopify/cli@latest theme check --fail-level error
